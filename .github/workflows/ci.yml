name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :shared:jvmTest :desktopApp:test :desktopApp:compileKotlin :androidApp:assembleDebug :androidApp:lintDebug
      - run: ./gradlew --no-daemon :desktopApp:packageDeb
      - run: ./scripts/package-host.sh
  ios-compile-link:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test :shared:linkReleaseFrameworkIosSimulatorArm64 :shared:linkReleaseFrameworkIosArm64
